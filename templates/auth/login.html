{% extends 'base.html' %}

{% block title %}Sign In | ShopEase{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
          <div class="logo-icon"><i class="bi bi-bag-heart-fill"></i></div>
          <span>Shop<span>Ease</span></span>
        </div>
        <h2>Welcome Back</h2>
        <p>Sign in to your account to continue shopping.</p>
      </div>

      <!-- Quick Fill Box for Evaluation/Testing -->
      <div class="demo-credentials-box">
        <div style="font-weight: 700; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.35rem;">
          <i class="bi bi-info-circle-fill text-primary"></i> Demo Accounts (1-Click Fill)
        </div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button type="button" class="demo-quick-btn" onclick="fillCredentials('user@shopease.com', 'user123')" id="quick-fill-user">
            <i class="bi bi-person"></i> Customer (user@shopease.com)
          </button>
          <button type="button" class="demo-quick-btn" onclick="fillCredentials('admin@shopease.com', 'admin123')" id="quick-fill-admin">
            <i class="bi bi-shield-lock"></i> Admin (admin@shopease.com)
          </button>
        </div>
      </div>

      <form action="{{ url_for('login', next=next) }}" method="POST" id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" class="form-control"
                 placeholder="name@example.com" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
          </div>
          <div style="position: relative;">
            <input type="password" id="login-password" name="password" class="form-control"
                   placeholder="Enter your password" required style="padding-right: 2.75rem;">
            <button type="button" class="password-toggle-btn" data-target="login-password"
                    style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gray-500); cursor: pointer; font-size: 1.1rem;">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;" id="login-submit-btn">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--gray-600);">
        Don't have an account? 
        <a href="{{ url_for('register') }}" style="font-weight: 700;" id="auth-switch-register">Register here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
